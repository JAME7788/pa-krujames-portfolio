<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Sarabun',sans-serif;background:transparent;padding:12px}
  .grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{background:#fff;border-radius:18px;padding:24px 14px;text-align:center;position:relative;overflow:hidden;
    box-shadow:0 4px 14px rgba(95,27,41,.10);transition:.3s;opacity:0;transform:translateY(20px)}
  .stat.in{opacity:1;transform:none}
  .stat:hover{transform:translateY(-6px);box-shadow:0 12px 26px rgba(95,27,41,.18)}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,#8a2333,#c9a227)}
  .icw{width:54px;height:54px;margin:0 auto 10px;border-radius:16px;display:flex;align-items:center;
    justify-content:center;font-size:26px;background:linear-gradient(135deg,#f8ebe4,#fdf6f1);
    transition:.3s}
  .stat:hover .icw{transform:rotate(-8deg) scale(1.12)}
  .num{font-family:'Prompt',sans-serif;font-weight:700;font-size:34px;color:#5f1b29;line-height:1.1}
  .num small{font-size:17px;font-weight:600;color:#c9a227}
  .label{font-size:13.5px;color:#6f5651;line-height:1.45;margin-top:4px}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <div class="grid">
    <div class="stat"><div class="icw">🕒</div><div class="num" data-n="23">0</div><div class="label">ชั่วโมงสอน/สัปดาห์<br>(ป.1 – ม.3)</div></div>
    <div class="stat"><div class="icw">🧩</div><div class="num" data-n="62">0<small>+</small></div><div class="label">สื่อ/นวัตกรรม<br>การจัดการเรียนรู้</div></div>
    <div class="stat"><div class="icw">📚</div><div class="num" data-n="139">0<small>+</small></div><div class="label">ชั่วโมงพัฒนาตนเอง<br>ยืนยันปี 2567–2568</div></div>
    <div class="stat"><div class="icw">🏆</div><div class="num" data-n="10">0<small>+</small></div><div class="label">ผลงานผู้ฝึกสอน<br>กรรมการ/รางวัล</div></div>
  </div>
<script>
  // การ์ดโผล่ทีละใบ + ตัวเลขวิ่งนับ
  document.querySelectorAll('.stat').forEach((el,i)=>{
    setTimeout(()=>el.classList.add('in'), 120*i);
  });
  document.querySelectorAll('.num').forEach(el=>{
    const target=+el.dataset.n;
    const t0=performance.now(), dur=1400;
    (function tick(t){
      const p=Math.min((t-t0)/dur,1), v=Math.round(target*(1-Math.pow(1-p,3)));
      el.firstChild.textContent=v;
      if(p<1)requestAnimationFrame(tick);
    })(t0);
    // กันเหนียว: ถ้าแอนิเมชันไม่ทำงาน ให้ขึ้นค่าจริงแน่นอน
    setTimeout(()=>{el.firstChild.textContent=target},1600);
  });
</script>
</body>
</html>
